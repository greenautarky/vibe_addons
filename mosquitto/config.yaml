---
# Published store entry for the ga_mosquitto add-on.
# Synced from the source repo greenautarky/MQTT by CI — DO NOT EDIT BY HAND.
# The only delta vs. the source config is the `image:` key: this entry is
# install-by-pull (the multi-arch image is built by the source repo's CI and
# published to GHCR), so the source repo can stay private.
# `version` stays in lock-step with the GHCR image tag and with the OS bake list
# (ha-operating-system buildroot-external/package/hassio/addon-images.json).
version: 7.2.1
slug: ga_mosquitto
name: GA Mosquitto broker
description: An Open Source MQTT broker
url: https://github.com/greenautarky/MQTT
codenotary: thomas@greenautarky.com
arch:
  - aarch64
  - amd64
  - armv7
auth_api: true
discovery:
  - mqtt
image: ghcr.io/greenautarky/ga_mosquitto-{arch}
map:
  - ssl
  - share
options:
  # Same shape as upstream home-assistant/addons: no default logins. The users
  # that exist are created by cont-init — `homeassistant` (discovery) and the
  # Supervisor's `addons` service registration. Rationale in the CHANGELOG.
  logins: []
  log_dest: []
  log_type: []
  require_certificate: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  customize:
    active: false
    folder: mosquitto
ports:
  1883/tcp: 1883
  1884/tcp: 1884
  8883/tcp: 8883
  8884/tcp: 8884
schema:
  logins:
    - username: str
      password: password
      password_pre_hashed: "bool?"
  log_dest:
    - list(none|stdout|stderr|topic)?
  log_type:
    - list(none|debug|error|warning|notice|information|subscribe|unsubscribe|websockets|all)?
  require_certificate: bool
  certfile: str
  cafile: str?
  keyfile: str
  customize:
    active: bool
    folder: str
  debug: bool?
services:
  - mqtt:provide
startup: system
watchdog: tcp://[HOST]:1883
init: false
