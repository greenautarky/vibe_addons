name: addon-store-lockstep

# Keep the three copies of an add-on's identity in step, in one place:
#
#   source repo config.yaml  ->  vibe_addons store entry  ->  OS bake pin
#
# The PUBLIC vibe_addons config.yaml is what the Supervisor reads (ports,
# options, schema, maps). Every add-on except ga_manager synced it BY HAND, so
# a change made only in a source repo shipped an image and reached no device.
# Two features were fleet-wide undeployable that way before anyone noticed.
# ga_manager's publish.yaml already did this; here it is once, for everyone.
#
# LIVES HERE, NOT IN THE PRIVATE OPS REPO. It was written there, and its only
# caller is a PUBLIC add-on repo — which cannot resolve a reusable workflow in
# a private one, `access_level: organization` or not. The call failed with
# `workflow was not found`, no jobs, no log, and the add-on could not publish
# at all for two days before anything touched its sources and revealed it.
# The store is public and this is store plumbing, so this is where it belongs;
# private callers can reach it here too, while the reverse is not true.
#
# ONE BEHAVIOUR, TWO FILES. Private add-on repos call the copy in the ops repo
# (ga-ops/.github/workflows/addon-store-lockstep.yml); a public caller cannot
# reach that one, so it calls this one. Both OPEN the store PR and never merge
# it: a store entry is what every device installs. What only this copy has is
# the public-repo plumbing — dispatch from the store with GITHUB_TOKEN, an
# unauthenticated source checkout, and the token liveness check.
#
# Deliberately SEPARATE from addon-publish.yml: that pipeline is python-shaped
# (PyArmor/Cython obfuscation checks against /app, home-assistant base images).
# ga_influxdbv1 is a Debian binary add-on with its own build and can never pass
# those gates — but it needs the store sync just as much. Any add-on repo can
# call this after its own build, whatever that build looks like.

on:
  # Dispatchable as well as callable. A store sync writes ONE line, but as a
  # tail of the publish pipeline a failed sync could only be repaired by
  # rebuilding every architecture — fifty minutes of QEMU for a one-line fix,
  # which is what it cost on 2026-08-19. Dispatched, it costs a minute.
  workflow_dispatch:
    inputs:
      addon_repo:
        description: "Add-on source repo, e.g. ga_hmvapp_addon (this repo is not it)"
        required: true
        type: string
      addon_dir:
        description: "Directory holding the add-on's source config.yaml"
        required: true
        type: string
      addon_slug:
        description: "GHCR image basename, e.g. ga_hmvapp_addon"
        required: true
        type: string
      store_dir:
        description: "Directory in vibe_addons; defaults to addon_slug"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      addon_dir:
        description: "Directory holding the add-on's source config.yaml"
        required: true
        type: string
      addon_slug:
        description: "GHCR image basename, e.g. ga_influxdbv1"
        required: true
        type: string
      image_ns:
        description: "GHCR namespace"
        required: false
        type: string
        default: ghcr.io/greenautarky
      store_dir:
        description: >-
          Directory inside the PUBLIC vibe_addons repo. Defaults to addon_slug
          (right for ga_default_addon / ga_hmvapp_addon); influxdb, mosquitto
          and zigbee2mqtt differ and must pass it explicitly.
        required: false
        type: string
        default: ""
    secrets:
      DOWNSTREAM_SYNC_PAT:
        description: >-
          Write access to vibe_addons (that is all this needs since the OS pin
          moved into ha-operating-system itself). Without it this announces
          itself as skipped — it never silently pretends to have synced.
        required: false

permissions:
  # `write` so a dispatch from the store can push its own entry. On the
  # workflow_call path the push still uses the caller's PAT (it may be a
  # different repository); on the dispatch path the target IS this repository
  # and GITHUB_TOKEN suffices. That difference is the whole reason a PUBLIC
  # add-on can now be synced without handing it a write-capable secret.
  contents: write
  # main takes changes only through a pull request (ruleset), so the sync
  # lands as a PR this job opens — and never merges. On the dispatch path
  # that is GITHUB_TOKEN.
  pull-requests: write

jobs:
  sync-downstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'

      # A PUBLIC source repo needs no credential to read, and passing an empty
      # secret made this step fail outright — so a public add-on could not be
      # dispatched at all. That is how ga_influxdbv1 came to be hand-synced
      # twice on 2026-08-26: it is public, so it must not hold a write-capable
      # token, so its own publish could not sync, and dispatching from here did
      # not work either. Try unauthenticated first; fall back for private ones.
      - name: Check out the add-on source repo (dispatch, public)
        if: github.event_name == 'workflow_dispatch'
        id: src_public
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: greenautarky/${{ inputs.addon_repo }}

      - name: Check out the add-on source repo (dispatch, private)
        if: github.event_name == 'workflow_dispatch' && steps.src_public.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: greenautarky/${{ inputs.addon_repo }}
          token: ${{ secrets.DOWNSTREAM_SYNC_PAT }}

      - name: Guard — is the token present?
        id: guard
        env:
          PAT: ${{ secrets.DOWNSTREAM_SYNC_PAT }}
          EVENT: ${{ github.event_name }}
          GH_DEFAULT: ${{ github.token }}
        run: |
          # DISPATCHED FROM THE STORE, the push target is this very repository
          # and GITHUB_TOKEN can write it. Demanding a cross-repo PAT here was
          # the reason a public add-on had no way to sync at all.
          if [ "${EVENT}" = "workflow_dispatch" ] && [ -z "${PAT:-}" ]; then
            echo "dispatched from the store itself — pushing with GITHUB_TOKEN"
            echo "::add-mask::${GH_DEFAULT}"
            echo "pat=${GH_DEFAULT}" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${PAT:-}" ]; then
            # Hard error, not a warning. Calling this workflow IS the statement
            # that the store should be synced; a missing token means it silently
            # was not, and the job then reports success for doing nothing. That
            # is exactly what happened on 2026-08-19: the secret had been
            # overwritten with an empty value, the guard skipped every step, and
            # the run went green while the store stayed three versions behind.
            echo "::error::DOWNSTREAM_SYNC_PAT is empty or unset. This workflow was called, so the store is expected to be synced — refusing to report success for a no-op. Set the secret in the calling repository."
            exit 1
          fi
          # A pasted secret routinely carries a trailing newline, and git then
          # fails with "credential url cannot be parsed" — a message that names
          # neither the secret nor the newline, and cost an hour to trace once.
          # Say it here, in one line, and carry on with the trimmed value.
          clean="$(printf '%s' "$PAT" | tr -d '[:space:]')"
          if [ "${#clean}" -ne "${#PAT}" ]; then
            echo "::warning::DOWNSTREAM_SYNC_PAT contains whitespace (probably a trailing newline from pasting). Using the trimmed value — re-paste it without the newline to silence this."
          fi
          if [ -z "$clean" ]; then
            echo "::error::DOWNSTREAM_SYNC_PAT is only whitespace"
            exit 1
          fi
          echo "::add-mask::$clean"
          echo "pat=$clean" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          # PRESENT IS NOT ALIVE, AND ALIVE IS NOT ALLOWED TO WRITE.
          #
          # Everything above proves a non-empty string exists. It cannot tell a
          # working credential from a revoked one, and a revoked token fails
          # LATER — at the push, in a job nobody opens, on the day of a release.
          #
          # On 2026-08-26 a leaked classic PAT was revoked on one account while
          # three repositories carried a DOWNSTREAM_SYNC_PAT set a week earlier.
          # Whether those were the same token could not be established from the
          # outside: a repository secret does not name its owner, and re-running
          # a sync with nothing to push only exercised a public READ. The answer
          # needed a write, and a release is the wrong moment to find out.
          #
          # Printed: the login, the scopes header, and whether the token may
          # write here. Never the value.
          who="$(curl -sS -H "Authorization: Bearer $clean" -D /tmp/pat-hdr \
                      https://api.github.com/user \
                 | sed -n 's/.*"login": *"\([^"]*\)".*/\1/p' | head -1)"
          scopes="$(sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: *//p' /tmp/pat-hdr | tr -d '\r')"
          if [ -z "$who" ]; then
            echo "::error::DOWNSTREAM_SYNC_PAT is set but GitHub does not accept it — revoked, expired or malformed. Rotate the secret in the calling repository."
            exit 1
          fi
          perm="$(curl -sS -H "Authorization: Bearer $clean" \
                       "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
                  | sed -n 's/.*"push": *\(true\|false\).*/\1/p' | head -1)"
          echo "token owner: ${who} | scopes: ${scopes:-<fine-grained>} | may push to ${GITHUB_REPOSITORY}: ${perm:-unknown}"
          if [ "$perm" != "true" ]; then
            echo "::error::The token belongs to ${who} and is alive, but cannot write to ${GITHUB_REPOSITORY}. A declared scope is a ceiling, not a grant — the effective right is the lower of the token's scope and its holder's permission."
            exit 1
          fi 

      - name: Install PyYAML
        if: steps.guard.outputs.enabled == 'true'
        run: pip install --quiet "PyYAML>=6,<7"

      - name: Read add-on version
        if: steps.guard.outputs.enabled == 'true'
        id: ver
        run: |
          set -euo pipefail
          f="${{ inputs.addon_dir }}/config.yaml"
          ver=$(awk 'BEGIN{IGNORECASE=1}
            /^[[:space:]]*version[[:space:]]*:/{
              sub(/^.*version[[:space:]]*:[[:space:]]*/,"");
              sub(/[[:space:]]*#.*/,""); gsub(/"/,""); gsub(/[[:space:]]/,"");
              print; exit
            }' "$f")
          [ -n "${ver:-}" ] || { echo "::error::could not read version from $f"; exit 1; }
          echo "value=$ver" >> "$GITHUB_OUTPUT"

      - name: Render the store entry (no push yet)
        if: steps.guard.outputs.enabled == 'true'
        env:
          PAT: ${{ steps.guard.outputs.pat }}
          STORE_DIR: ${{ inputs.store_dir || inputs.addon_slug }}
          SLUG: ${{ inputs.addon_slug }}
          # workflow_dispatch has no image_ns input, and a workflow_call default
          # does not apply there: the dispatch path rendered `image: /<slug>-{arch}`.
          IMAGE_NS: ${{ inputs.image_ns || 'ghcr.io/greenautarky' }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${PAT}@github.com/greenautarky/vibe_addons.git" .store
          test -d ".store/${STORE_DIR}" || { echo "::error::vibe_addons/${STORE_DIR} does not exist — pass the right store_dir"; exit 1; }
          cp ".store/${STORE_DIR}/config.yaml" /tmp/store-before.yaml
          python3 .store/scripts/render_store_config.py \
            "${{ inputs.addon_dir }}/config.yaml" \
            --image "${IMAGE_NS}/${SLUG}-{arch}" \
            --name "${SLUG}" \
            --source-repo "${{ inputs.addon_repo || github.event.repository.name }}" \
            > /tmp/store-rendered.yaml

      # The automation may ADD and CHANGE keys. It may never DELETE one that the
      # store publishes today: `image:` alone decides whether the Supervisor can
      # install the add-on at all, and a source that simply never had a key would
      # otherwise silently strip it fleet-wide. Checked BEFORE the push, because a
      # proof that runs after the damage is not a gate.
      - name: Refuse to drop keys the store publishes today
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import sys, yaml
          before = yaml.safe_load(open("/tmp/store-before.yaml")) or {}
          after = yaml.safe_load(open("/tmp/store-rendered.yaml")) or {}
          if not after:
              print("::error::rendered store entry is empty — refusing to push")
              sys.exit(1)
          removed = sorted(set(before) - set(after))
          if removed:
              print("::error::the render would DELETE keys the store publishes today: "
                    + ", ".join(removed))
              print("::error::reconcile the source config first — automation must not strip "
                    "published keys")
              sys.exit(1)
          print("no keys would be removed (%d -> %d)" % (len(before), len(after)))
          EOF

      # THROUGH A PULL REQUEST, NOT A PUSH TO MAIN. Since 2026-09-24 vibe_addons
      # main takes changes only through a PR with a required check (ruleset).
      # Until 2026-09-28 this copy then armed auto-merge and waited for it,
      # while the ops-repo copy opened the PR and stopped; one behaviour was
      # chosen for both: open the PR, never merge it.
      # Same shape as ga_manager's own sync: a fixed branch per version
      # (re-runs update it instead of piling up), an existing open PR is
      # reused, and the URL is QUERIED afterwards, never parsed from
      # `gh pr create` — so a lost response cannot turn into a false failure,
      # and a PR that was not created cannot turn into a false success.
      # Proposes, never merges: a store entry is what every device installs.
      - name: Open the store PR
        id: pr
        if: steps.guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.guard.outputs.pat }}
          VER: ${{ steps.ver.outputs.value }}
          STORE_DIR: ${{ inputs.store_dir || inputs.addon_slug }}
          SLUG: ${{ inputs.addon_slug }}
          SRC: ${{ inputs.addon_repo || github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_DEFAULT: ${{ github.token }}
        run: |
          set -euo pipefail
          # The commit the store entry was rendered from: the checked-out source
          # (the caller's commit, or the dispatched repo's default branch).
          src_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          cp /tmp/store-rendered.yaml ".store/${STORE_DIR}/config.yaml"
          cd .store
          if git diff --quiet -- "${STORE_DIR}/config.yaml"; then
            echo "store already in sync at ${VER} — no PR needed"
            echo "verify_ref=origin/main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          br="ci/sync-${SLUG}-${VER}"
          git config user.name "ga-ci-bot"
          git config user.email "ci@greenautarky.com"
          git checkout -q -b "$br"
          git commit -qm "chore(${SLUG}): full-body store sync to ${VER} (auto-lockstep from ${SRC} ${src_sha:0:12})" \
            -- "${STORE_DIR}/config.yaml"
          git push -q -f origin "HEAD:refs/heads/${br}"
          printf '%s\n\n%s\n' \
            "Auto-generated by \`${SRC}\` CI after publishing \`${VER}\`: renders \`${STORE_DIR}/config.yaml\` from the source config at \`${SRC}@${src_sha}\` (run: ${RUN_URL})." \
            "The OS bake pin (\`addon-images.json\` in ha-operating-system) is NOT opened by this job; pin it separately so the store and the bake stay in step." \
            > /tmp/store-pr-body.md
          open_pr() {
            gh pr list --repo greenautarky/vibe_addons --head "$br" --base main \
              --state open --json url -q '.[0].url // empty'
          }
          url="$(open_pr || true)"
          if [ -n "$url" ]; then
            echo "open store PR for ${br} already exists — branch updated: ${url}"
          else
            # Retried: a transient 5xx here strands the release exactly like
            # the refused push did. Before each retry, look again — the
            # previous attempt may have created the PR and lost the response.
            for attempt in 1 2 3; do
              if gh pr create --repo greenautarky/vibe_addons --base main --head "$br" \
                   --title "chore(${SLUG}): store config sync to ${VER}" \
                   --body-file /tmp/store-pr-body.md >/dev/null; then
                break
              fi
              echo "::warning::gh pr create failed (attempt ${attempt}/3)"
              sleep $((attempt * 10))
              [ -n "$(open_pr || true)" ] && break
            done
            url="$(open_pr || true)"
          fi
          if [ -z "$url" ]; then
            echo "::error::the store PR for ${STORE_DIR} ${VER} was neither created nor found. The image is published but no device can reach it. Does DOWNSTREAM_SYNC_PAT have pull-requests:write on greenautarky/vibe_addons?"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GH_TOKEN}" = "${GH_DEFAULT}" ]; then
            # A PR opened with GITHUB_TOKEN starts no workflow runs, so the
            # required store-image-gate check will not start on it by itself.
            echo "::warning::${url} was opened with GITHUB_TOKEN, so its required check has not started — close and reopen it (or push to the branch) to run the gate"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "verify_ref=origin/${br}" >> "$GITHUB_OUTPUT"
          echo "vibe_addons store PR -> ${url}"
          {
            echo "### Store sync for ${SLUG} ${VER}"
            echo ""
            echo "vibe_addons PR: ${url} (not merged by CI)."
            echo "The OS bake pin is not opened by this job — pin it separately."
          } >> "$GITHUB_STEP_SUMMARY"

      # Proven against what the REMOTE holds — the PR branch, or main when
      # nothing moved — not against the local clone: the clone holds the
      # rendered file whether or not the push happened, so a check on it
      # would stay green through a refused push.
      - name: Prove the store PR carries the source config
        if: steps.guard.outputs.enabled == 'true'
        env:
          STORE_DIR: ${{ inputs.store_dir || inputs.addon_slug }}
          REF: ${{ steps.pr.outputs.verify_ref }}
        run: |
          set -euo pipefail
          test -n "${REF}" || { echo "::error::no ref to verify — the PR step did not report one"; exit 1; }
          git -C .store fetch -q origin "+refs/heads/${REF#origin/}:refs/remotes/${REF}"
          git -C .store show "${REF}:${STORE_DIR}/config.yaml" > /tmp/store-on-remote.yaml
          echo "verifying ${REF}"
          python3 .store/scripts/verify_store_sync.py \
            "${{ inputs.addon_dir }}/config.yaml" \
            /tmp/store-on-remote.yaml \
            --image "${{ inputs.image_ns || 'ghcr.io/greenautarky' }}/${{ inputs.addon_slug }}-{arch}" \
            --name "${{ inputs.addon_slug }}" \
            --source-repo "${{ inputs.addon_repo || github.event.repository.name }}"

      # The addon-images.json pin PR used to live here and needed write access to
      # ha-operating-system. It moved INTO that repo (pin-addon-images.yml) on
      # 2026-08-18 — and that file was REMOVED on 2026-09-15 (ha-operating-system
      # #533): a PR opened with GITHUB_TOKEN starts no workflow runs, so it could
      # never satisfy master's required checks. Since then only ga_manager's own
      # publish opens a bake-pin PR; for every add-on that calls this workflow
      # the pin is set by hand, and version-check.yml (hourly) goes red while it
      # lags. Stated here so nobody reads this job as covering the pin.
