# Published store entry for the ga_default_addon add-on.
# Synced from the source repo greenautarky/ga_default_addon by CI — DO NOT EDIT BY HAND.
# The only delta vs. the source config is the `image:` key: this entry is
# install-by-pull (the multi-arch image is built by the source repo's CI and
# published to GHCR), so the source repo can stay private.
# `version` stays in lock-step with the GHCR image tag and with the OS bake list
# (ha-operating-system buildroot-external/package/hassio/addon-images.json).
name: "GA Default Addon"
version: 1.4.0
slug: "ga_default_addon"
codenotary: notary@greenautarky.com
image: ghcr.io/greenautarky/ga_default_addon-{arch}
url: https://github.com/greenautarky/ga_default_addon
description: "GA Home Assistant add-on running the default VOS functions"
startup: services
map:
  - share:rw
boot: auto
arch:
  - aarch64
  - amd64
  - armv7
volumes:
  /influxdb_data: share
services:
  - mqtt:need
options:
  INFLUXDB_HOST: 99f1cad4-ga-influxdbv1
  INFLUXDB_PORT: 8086
  INFLUXDB_USERNAME: ga_ha_influx_user
  INFLUXDB_DATABASE: ga_homeassistant_db
  INFLUXDB_GD_DATABASE: gd_data
  INFLUXDB_PD_DATABASE: pd_data
  LOCAL_TZ: Europe/Berlin
  CHECK_INTERVAL: 10
  GD_DIRECTORY: /data/gd_data
  DATA_DURATION: 7d
  DURATION: 7
  PD_DIRECTORY: /data/pd_data
  FUNCTION_RECURSION: 43200
  LATITUDE: "51.07657"
  LONGITUDE: "6.60159"
  CITY: Grevenbroich
  COUNTRY: Germany
  TB_URL: https://thingsboard.greenautarky.com
  TB_DEVICE_TOKEN: x
  # Transitional: legacy devices that have not yet migrated off the old UI
  # still push aggregated data to the cloud DB. Every other system leaves
  # this false. Turning it on ALSO requires the five DB_* options below;
  # neither half works alone. Remove option + code when the migration ends.
  legacy_cloud_push: false
schema:
  INFLUXDB_HOST: str
  INFLUXDB_PORT: int
  INFLUXDB_USERNAME: str
  INFLUXDB_DATABASE: str
  INFLUXDB_GD_DATABASE: str
  INFLUXDB_PD_DATABASE: str
  LOCAL_TZ: str
  CHECK_INTERVAL: int
  GD_DIRECTORY: str
  DATA_DURATION: str
  DURATION: int
  PD_DIRECTORY: str
  FUNCTION_RECURSION: int
  LATITUDE: str
  LONGITUDE: str
  CITY: str
  COUNTRY: str
  TB_URL: str
  TB_DEVICE_TOKEN: str
  DB_HOST: str?
  DB_NAME: str?
  DB_USERNAME: str?
  DB_PASSWORD: str?
  DB_PORT: int?
  legacy_cloud_push: bool
init: false
