name: addon-store-lockstep

# Keep the three copies of an add-on's identity in step, in one place:
#
#   source repo config.yaml  ->  vibe_addons store entry  ->  OS bake pin
#
# This workflow covers both arrows, as two PULL REQUESTS that it opens and
# never merges: the store PR here, then the bake-pin PR on ha-operating-system
# (addon-images.json + the generated expected.env). A store entry is what
# every device installs, and main here takes changes only through a PR with a
# required check; a person merges both.
#
# THE ONLY COPY. It lives in this PUBLIC repository because a public add-on
# repo cannot call a reusable workflow (or use an action) in a private one,
# while a private repo can call a public one. Private add-on repos call it
# directly or through the ops repo's shared publish pipeline; public add-on
# repos call it directly. There is no second copy to drift from this one.
#
# Credential: .github/actions/release-token in this repository — the
# ga-release-bot GitHub App when its secrets reach the caller, the transitional
# DOWNSTREAM_SYNC_PAT with a loud warning otherwise, a hard error with neither.
# An App token, unlike GITHUB_TOKEN, starts the target repo's checks, which is
# what lets a bot-opened pin PR pass its required checks.
#
# Secrets reach this workflow only from its caller: `secrets: inherit` (same
# organization) or explicitly. The job's own GITHUB_TOKEN is used for nothing
# but checking out the caller's source, so the workflow asks for
# `contents: read` and nothing else — and callers need grant no more.
#
# Deliberately SEPARATE from the python-shaped publish pipeline (obfuscation
# checks, home-assistant base images): Debian binary add-ons have their own
# build but need the store sync just as much. Any add-on repo can call this
# after its own build, whatever that build looks like.

on:
  # Dispatchable as well as callable: a store sync as the tail of a publish
  # could otherwise only be repaired by rebuilding every architecture. A
  # dispatch here runs with THIS repository's secrets, so it needs the App
  # secrets to be visible to this repository — without them it fails loudly.
  workflow_dispatch:
    inputs:
      addon_repo:
        description: "Add-on source repo, e.g. ga_hmvapp_addon (this repo is not it)"
        required: true
        type: string
      addon_dir:
        description: "Directory holding the add-on's source config.yaml"
        required: true
        type: string
      addon_slug:
        description: "GHCR image basename, e.g. ga_hmvapp_addon"
        required: true
        type: string
      store_dir:
        description: "Directory in vibe_addons; defaults to addon_slug"
        required: false
        type: string
        default: ""
      bake_pin:
        description: "auto | required | none — see the workflow_call input"
        required: false
        type: string
        default: auto
  workflow_call:
    inputs:
      addon_dir:
        description: "Directory holding the add-on's source config.yaml"
        required: true
        type: string
      addon_slug:
        description: "GHCR image basename, e.g. ga_influxdbv1"
        required: true
        type: string
      image_ns:
        description: "GHCR namespace"
        required: false
        type: string
        default: ghcr.io/greenautarky
      store_dir:
        description: >-
          Directory inside this store repo. Defaults to addon_slug (right for
          ga_default_addon / ga_hmvapp_addon); influxdb, mosquitto and
          zigbee2mqtt differ and must pass it explicitly.
        required: false
        type: string
        default: ""
      bake_pin:
        description: >-
          Does this add-on have a bake pin in ha-operating-system's
          addon-images.json? `auto` (default): open the pin PR when an entry
          whose image is <image_ns>/<addon_slug>-{arch} exists, WARN when none
          does. `required`: no entry is a hard error. `none`: this add-on is not
          baked — skip, and fail if an entry exists after all.
        required: false
        type: string
        default: auto
    secrets:
      GA_RELEASE_APP_ID:
        description: "ga-release-bot App: Client ID (or numeric App ID)."
        required: false
      GA_RELEASE_APP_PRIVATE_KEY:
        description: "ga-release-bot App: PEM private key."
        required: false
      DOWNSTREAM_SYNC_PAT:
        description: >-
          TRANSITIONAL fallback, used only when the App secrets are not visible
          — with a loud warning. Needs contents + pull-requests write on
          vibe_addons, and on ha-operating-system for a baked add-on.
        required: false

# Least privilege. Every write goes through the release credential; the job's
# own GITHUB_TOKEN only checks out the caller's source. A called workflow can
# never hold more than its caller grants, so asking for more here would make
# every caller that grants `contents: read` fail to even start.
permissions:
  contents: read

jobs:
  sync-downstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name != 'workflow_dispatch'
        with:
          persist-credentials: false

      # Dispatched: a PUBLIC source repo needs no credential to read, so try
      # unauthenticated first; only a private one needs the release token to
      # cover it as well (see the next step).
      - name: Check out the add-on source repo (dispatch, public)
        if: github.event_name == 'workflow_dispatch'
        id: src_public
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: greenautarky/${{ inputs.addon_repo }}
          persist-credentials: false

      # One credential for everything below, selected by the shared action —
      # the same one ga_manager's publish uses. Nothing in this job reads
      # secrets.DOWNSTREAM_SYNC_PAT directly; tests/release_token asserts that.
      # Referenced by full path: in a called workflow `./` would resolve to the
      # CALLER's checkout, not to this repository.
      - name: Release credential (ga-release-bot App, loud PAT fallback)
        id: token
        uses: greenautarky/vibe_addons/.github/actions/release-token@main
        with:
          app-id: ${{ secrets.GA_RELEASE_APP_ID }}
          app-private-key: ${{ secrets.GA_RELEASE_APP_PRIVATE_KEY }}
          fallback-pat: ${{ secrets.DOWNSTREAM_SYNC_PAT }}
          repositories: ${{ (github.event_name == 'workflow_dispatch' && steps.src_public.outcome == 'failure') && format('vibe_addons,ha-operating-system,{0}', inputs.addon_repo) || 'vibe_addons,ha-operating-system' }}

      - name: Check out the add-on source repo (dispatch, private)
        if: github.event_name == 'workflow_dispatch' && steps.src_public.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: greenautarky/${{ inputs.addon_repo }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --quiet "PyYAML>=6,<7"

      - name: Read add-on version
        id: ver
        env:
          ADDON_DIR: ${{ inputs.addon_dir }}
        run: |
          set -euo pipefail
          f="${ADDON_DIR}/config.yaml"
          ver=$(awk 'BEGIN{IGNORECASE=1}
            /^[[:space:]]*version[[:space:]]*:/{
              sub(/^.*version[[:space:]]*:[[:space:]]*/,"");
              sub(/[[:space:]]*#.*/,""); gsub(/"/,""); gsub(/[[:space:]]/,"");
              print; exit
            }' "$f")
          [ -n "${ver:-}" ] || { echo "::error::could not read version from $f"; exit 1; }
          echo "value=$ver" >> "$GITHUB_OUTPUT"

      - name: Render the store entry (no push yet)
        env:
          PAT: ${{ steps.token.outputs.token }}
          ADDON_DIR: ${{ inputs.addon_dir }}
          STORE_DIR: ${{ inputs.store_dir || inputs.addon_slug }}
          SLUG: ${{ inputs.addon_slug }}
          SRC: ${{ inputs.addon_repo || github.event.repository.name }}
          # workflow_dispatch has no image_ns input, and a workflow_call default
          # does not apply there: the dispatch path rendered `image: /<slug>-{arch}`.
          IMAGE_NS: ${{ inputs.image_ns || 'ghcr.io/greenautarky' }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 "https://x-access-token:${PAT}@github.com/greenautarky/vibe_addons.git" .store
          test -d ".store/${STORE_DIR}" || { echo "::error::vibe_addons/${STORE_DIR} does not exist — pass the right store_dir"; exit 1; }
          cp ".store/${STORE_DIR}/config.yaml" /tmp/store-before.yaml
          python3 .store/scripts/render_store_config.py \
            "${ADDON_DIR}/config.yaml" \
            --image "${IMAGE_NS}/${SLUG}-{arch}" \
            --name "${SLUG}" \
            --source-repo "${SRC}" \
            > /tmp/store-rendered.yaml

      # The automation may ADD and CHANGE keys. It may never DELETE one that the
      # store publishes today: `image:` alone decides whether the Supervisor can
      # install the add-on at all, and a source that simply never had a key would
      # otherwise silently strip it fleet-wide. Checked BEFORE the push, because a
      # proof that runs after the damage is not a gate.
      - name: Refuse to drop keys the store publishes today
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import sys, yaml
          before = yaml.safe_load(open("/tmp/store-before.yaml")) or {}
          after = yaml.safe_load(open("/tmp/store-rendered.yaml")) or {}
          if not after:
              print("::error::rendered store entry is empty — refusing to push")
              sys.exit(1)
          removed = sorted(set(before) - set(after))
          if removed:
              print("::error::the render would DELETE keys the store publishes today: "
                    + ", ".join(removed))
              print("::error::reconcile the source config first — automation must not strip "
                    "published keys")
              sys.exit(1)
          print("no keys would be removed (%d -> %d)" % (len(before), len(after)))
          EOF

      # THROUGH A PULL REQUEST, NOT A PUSH TO MAIN: main takes changes only
      # through a PR with a required check (ruleset). A fixed branch per version
      # (re-runs update it instead of piling up), an existing open PR is reused,
      # and the URL is QUERIED afterwards, never parsed from `gh pr create` — so
      # a lost response cannot turn into a false failure, and a PR that was not
      # created cannot turn into a false success. Proposes, never merges.
      - name: Open the store PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CRED: ${{ steps.token.outputs.mode }}
          VER: ${{ steps.ver.outputs.value }}
          STORE_DIR: ${{ inputs.store_dir || inputs.addon_slug }}
          SLUG: ${{ inputs.addon_slug }}
          SRC: ${{ inputs.addon_repo || github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The commit the store entry was rendered from: the checked-out source
          # (the caller's commit, or the dispatched repo's default branch).
          src_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          cp /tmp/store-rendered.yaml ".store/${STORE_DIR}/config.yaml"
          cd .store
          if git diff --quiet -- "${STORE_DIR}/config.yaml"; then
            echo "store already in sync at ${VER} — no PR needed"
            echo "verify_ref=origin/main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          br="ci/sync-${SLUG}-${VER}"
          git config user.name "ga-release-bot"
          git config user.email "ci@greenautarky.com"
          git checkout -q -b "$br"
          git commit -qm "chore(${SLUG}): full-body store sync to ${VER} (auto-lockstep from ${SRC} ${src_sha:0:12})" \
            -- "${STORE_DIR}/config.yaml"
          git push -q -f origin "HEAD:refs/heads/${br}"
          printf '%s\n\n%s\n' \
            "Auto-generated by \`${SRC}\` CI after publishing \`${VER}\`: renders \`${STORE_DIR}/config.yaml\` from the source config at \`${SRC}@${src_sha}\` (run: ${RUN_URL})." \
            "**Merge together with the ha-operating-system bake-pin PR** that the same run opens (cross-linked in a comment, unless this add-on is not baked). Merge THIS one first: the pin PR's \`check-versions\` compares the bake pin with the store and stays red until the store carries this version." \
            > /tmp/store-pr-body.md
          open_pr() {
            gh pr list --repo greenautarky/vibe_addons --head "$br" --base main \
              --state open --json url -q '.[0].url // empty'
          }
          url="$(open_pr || true)"
          if [ -n "$url" ]; then
            echo "open store PR for ${br} already exists — branch updated: ${url}"
          else
            # Retried: a transient 5xx here strands the release. Before each
            # retry, look again — the previous attempt may have created the PR
            # and lost the response.
            for attempt in 1 2 3; do
              if gh pr create --repo greenautarky/vibe_addons --base main --head "$br" \
                   --title "chore(${SLUG}): store config sync to ${VER}" \
                   --body-file /tmp/store-pr-body.md >/dev/null; then
                break
              fi
              echo "::warning::gh pr create failed (attempt ${attempt}/3)"
              sleep $((attempt * 10))
              [ -n "$(open_pr || true)" ] && break
            done
            url="$(open_pr || true)"
          fi
          if [ -z "$url" ]; then
            echo "::error::the store PR for ${STORE_DIR} ${VER} was neither created nor found. The image is published but no device can reach it. Does the release credential (${CRED}) have pull-requests:write on greenautarky/vibe_addons?"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "verify_ref=origin/${br}" >> "$GITHUB_OUTPUT"
          echo "vibe_addons store PR -> ${url}"

      # Proven against what the REMOTE holds — the PR branch, or main when
      # nothing moved — not against the local clone: the clone holds the
      # rendered file whether or not the push happened, so a check on it
      # would stay green through a refused push.
      - name: Prove the store PR carries the source config
        env:
          ADDON_DIR: ${{ inputs.addon_dir }}
          STORE_DIR: ${{ inputs.store_dir || inputs.addon_slug }}
          REF: ${{ steps.pr.outputs.verify_ref }}
          SLUG: ${{ inputs.addon_slug }}
          SRC: ${{ inputs.addon_repo || github.event.repository.name }}
          IMAGE_NS: ${{ inputs.image_ns || 'ghcr.io/greenautarky' }}
        run: |
          set -euo pipefail
          test -n "${REF}" || { echo "::error::no ref to verify — the PR step did not report one"; exit 1; }
          git -C .store fetch -q origin "+refs/heads/${REF#origin/}:refs/remotes/${REF}"
          git -C .store show "${REF}:${STORE_DIR}/config.yaml" > /tmp/store-on-remote.yaml
          echo "verifying ${REF}"
          python3 .store/scripts/verify_store_sync.py \
            "${ADDON_DIR}/config.yaml" \
            /tmp/store-on-remote.yaml \
            --image "${IMAGE_NS}/${SLUG}-{arch}" \
            --name "${SLUG}" \
            --source-repo "${SRC}"

      # ── The OS bake pin ─────────────────────────────────────────────────────
      # Same shape as ga_manager's pin step: bump the entry in addon-images.json,
      # regenerate tests/ga_tests/os_integrity/expected.env with the OS repo's
      # own generator (the OS CI fails a PR where the two disagree), fixed
      # branch per version, reuse an open PR, query the URL.
      # The pin PR goes green only after the store PR is merged — its
      # check-versions compares the pin with the store. It is opened now and NOT
      # waited for: waiting would hold this job for a human merge.
      - name: Check out the OS bake pins
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/greenautarky/ha-operating-system.git" .os

      # Which addon-images.json entry is this add-on? Matched by IMAGE, not by
      # name: the keys are not the slugs (ga_mosquitto is `mosquitto`), but the
      # image is exactly what the bake pulls. tests/lockstep_bake_pin drives it.
      - name: Find this add-on's bake pin
        id: pinkey
        env:
          PINS_FILE: .os/buildroot-external/package/hassio/addon-images.json
          IMAGE: ${{ inputs.image_ns || 'ghcr.io/greenautarky' }}/${{ inputs.addon_slug }}-{arch}
          BAKE_PIN: ${{ inputs.bake_pin || 'auto' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          mode = os.environ["BAKE_PIN"]
          image = os.environ["IMAGE"]
          if mode not in ("auto", "required", "none"):
              print(f"::error::bake_pin must be auto, required or none — got {mode!r}")
              sys.exit(1)
          try:
              addons = json.load(open(os.environ["PINS_FILE"]))["addons"]
          except Exception as e:  # a pin file we cannot read is not "not baked"
              print(f"::error::cannot read the bake pins ({os.environ['PINS_FILE']}): {e}")
              sys.exit(1)
          if not addons:
              print("::error::addon-images.json lists no add-ons at all — refusing to read that as 'not baked'")
              sys.exit(1)
          hits = sorted(k for k, e in addons.items() if (e or {}).get("image") == image)
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if len(hits) > 1:
              print(f"::error::{len(hits)} addon-images.json entries use {image}: {', '.join(hits)} — cannot tell which one to pin")
              sys.exit(1)
          if hits:
              key = hits[0]
              if mode == "none":
                  print(f"::error::this caller says bake_pin: none, but addon-images.json pins {image} as '{key}'. "
                        "That pin would silently fall behind every release — drop `bake_pin: none` from the caller.")
                  sys.exit(1)
              cur = addons[key].get("version", "")
              print(f"bake pin: '{key}' = {cur}")
              out.write(f"action=pin\nkey={key}\ncurrent={cur}\n")
              sys.exit(0)
          if mode == "required":
              print(f"::error::no addon-images.json entry uses {image}, and this caller says bake_pin: required")
              sys.exit(1)
          if mode == "auto":
              print(f"::warning::no addon-images.json entry uses {image}, so no bake-pin PR was opened. "
                    "If this add-on IS baked, its image name and the pin have drifted apart; "
                    "if it is not, pass `bake_pin: none` from the caller to say so.")
          else:
              print(f"not baked (bake_pin: none, and no entry uses {image}) — no pin PR")
          out.write("action=skip\n")
          PY

      - name: Open the bake-pin PR (ha-operating-system)
        id: pin
        if: steps.pinkey.outputs.action == 'pin'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CRED: ${{ steps.token.outputs.mode }}
          VER: ${{ steps.ver.outputs.value }}
          KEY: ${{ steps.pinkey.outputs.key }}
          CUR: ${{ steps.pinkey.outputs.current }}
          SLUG: ${{ inputs.addon_slug }}
          SRC: ${{ inputs.addon_repo || github.event.repository.name }}
          STORE_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd .os
          f=buildroot-external/package/hassio/addon-images.json
          if [ "$CUR" = "$VER" ]; then
            echo "addon-images.json already pins ${KEY} at ${VER} — no PR needed"
            echo "verify_ref=origin/master" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tmp=$(mktemp)
          jq --arg k "$KEY" --arg v "$VER" '.addons[$k].version = $v' "$f" > "$tmp" && mv "$tmp" "$f"
          # The generator reads only the repo's own declarations and fails
          # closed; `set -e` turns a failure into a red step, not a PR that is
          # red on arrival.
          bash tests/ga_tests/os_integrity/gen_expected.sh >/dev/null
          br="ci/pin-${SLUG}-${VER}"
          git config user.name "ga-release-bot"
          git config user.email "ci@greenautarky.com"
          git checkout -q -b "$br"
          git commit -qm "chore(bake): pin ${SLUG} addon image to ${VER} (auto from ${SRC} CI)" \
            -- "$f" tests/ga_tests/os_integrity/expected.env
          git push -q -f origin "HEAD:refs/heads/${br}"
          printf '%s\n\n%s\n\n%s\n' \
            "Auto-generated by \`${SRC}\` CI after publishing \`${VER}\` (run: ${RUN_URL}). Bumps \`${KEY}\` in \`addon-images.json\` from \`${CUR}\` and regenerates \`expected.env\` with \`gen_expected.sh\`." \
            "**Merge together with the vibe_addons store PR:** ${STORE_URL:-(none — the store was already at this version)}" \
            "Merge the store PR FIRST. \`check-versions\` compares this pin with the store and stays red until the store carries \`${VER}\`; re-run it after the store merge. Merging only one of the two puts the store and the bake out of step." \
            > /tmp/pin-pr-body.md
          open_pr() {
            gh pr list --repo greenautarky/ha-operating-system --head "$br" --base master \
              --state open --json url -q '.[0].url // empty'
          }
          url="$(open_pr || true)"
          if [ -n "$url" ]; then
            echo "open bake-pin PR for ${br} already exists — branch updated: ${url}"
          else
            for attempt in 1 2 3; do
              if gh pr create --repo greenautarky/ha-operating-system --base master --head "$br" \
                   --title "chore(bake): pin ${SLUG} addon image to ${VER}" \
                   --body-file /tmp/pin-pr-body.md >/dev/null; then
                break
              fi
              echo "::warning::gh pr create failed (attempt ${attempt}/3)"
              sleep $((attempt * 10))
              [ -n "$(open_pr || true)" ] && break
            done
            url="$(open_pr || true)"
          fi
          if [ -z "$url" ]; then
            echo "::error::the bake-pin PR for ${KEY} ${VER} was neither created nor found. The store PR may now be ahead of addon-images.json — the half-applied lockstep this job exists to avoid. Does the release credential (${CRED}) have pull-requests:write on greenautarky/ha-operating-system?"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "verify_ref=origin/${br}" >> "$GITHUB_OUTPUT"
          echo "bake-pin PR -> ${url}"

      # Against the REMOTE branch, for the same reason as the store proof.
      - name: Prove the bake-pin PR carries this version
        id: pinproof
        if: steps.pinkey.outputs.action == 'pin'
        env:
          REF: ${{ steps.pin.outputs.verify_ref }}
          KEY: ${{ steps.pinkey.outputs.key }}
          VER: ${{ steps.ver.outputs.value }}
          IMAGE: ${{ inputs.image_ns || 'ghcr.io/greenautarky' }}/${{ inputs.addon_slug }}-armv7
        run: |
          set -euo pipefail
          test -n "${REF}" || { echo "::error::no ref to verify — the pin step did not report one"; exit 1; }
          git -C .os fetch -q --depth 1 origin "+refs/heads/${REF#origin/}:refs/remotes/${REF}"
          got=$(git -C .os show "${REF}:buildroot-external/package/hassio/addon-images.json" | jq -r --arg k "$KEY" '.addons[$k].version')
          [ "$got" = "$VER" ] || { echo "::error::${REF} pins ${KEY} at '${got}', not ${VER}"; exit 1; }
          git -C .os show "${REF}:tests/ga_tests/os_integrity/expected.env" | grep -qF "${KEY}=${IMAGE}:${VER}" \
            || { echo "::error::${REF}: expected.env does not carry ${KEY}=${IMAGE}:${VER} — the pin PR would be red on arrival"; exit 1; }
          echo "verified ${REF}: ${KEY} = ${VER}, expected.env in step"

      - name: Cross-link the pair + run summary
        if: always() && steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CRED: ${{ steps.token.outputs.mode }}
          SLUG: ${{ inputs.addon_slug }}
          VER: ${{ steps.ver.outputs.value }}
          STORE: ${{ steps.pr.outputs.url }}
          PIN: ${{ steps.pin.outputs.url }}
          PIN_ACTION: ${{ steps.pinkey.outputs.action }}
          PIN_OUTCOME: ${{ steps.pin.outcome }}
          PIN_PROOF: ${{ steps.pinproof.outcome }}
        run: |
          set -uo pipefail
          if [ -n "${STORE:-}" ] && [ -n "${PIN:-}" ]; then
            gh pr comment "$STORE" --body "Pairs with the bake pin: $PIN — **merge both, this one first**." \
              || echo "::warning::could not comment on ${STORE}"
          fi
          case "${PIN_ACTION:-}" in
            pin)
              if [ "${PIN_OUTCOME:-}" != success ] || [ "${PIN_PROOF:-}" != success ]; then
                pin_row="**FAILED — see the failed step** ${PIN:-}"
              else
                pin_row="${PIN:-_none (already pinned)_}"
              fi ;;
            skip) pin_row="_none — not baked (see the annotation)_" ;;
            *)    pin_row="**not reached — see the failed step**" ;;
          esac
          {
            echo "### Lockstep PRs for ${SLUG} ${VER}"
            echo ""
            echo "| Side | PR |"
            echo "|---|---|"
            echo "| vibe_addons store | ${STORE:-_none (already in sync)_} |"
            echo "| addon-images.json bake pin | ${pin_row} |"
            echo ""
            echo "Opened with: \`${CRED}\` credential. Not merged by CI. Merge the store PR first, then the pin PR (its check-versions goes green once the store carries ${VER})."
          } >> "$GITHUB_STEP_SUMMARY"
