name: Pin drift (built-but-never-wired)

# Reconcile each self-build add-on's pinned version (<addon>/config.yaml)
# against the newest tag actually published on ghcr. Catches the failure mode
# behind the ga_mosquitto 7.1.1→K31 incident: a fixed image (7.1.2) was built +
# published but the pin was never bumped, so devices kept pulling the broken one.

on:
  pull_request:
    paths:
      # BOTH extensions. TWO store entries are config.JSON — zigbee2mqtt and
      # hassio-ihost-sonoff-dongle-flasher — so a yaml-only filter made every
      # change to either of them invisible to this trigger. The drift z2m
      # carried (2.12.1-3 pinned, -4 published) surfaced days later on an
      # unrelated pull request, via the weekly sweep that reads everything.
      # A gate that cannot see something it guards is not weaker for that
      # thing; it is absent — and it still reports green, which is the part
      # that costs.
      - "*/config.yaml"
      - "*/config.json"
      - "tools/check_pin_drift.sh"
      - ".github/workflows/pin-drift.yaml"
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC — weekly drift sweep
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  pin-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile pinned vs published (ghcr)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/check_pin_drift.sh
