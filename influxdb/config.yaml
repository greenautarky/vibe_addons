---
# Published store entry for the ga_influxdbv1 add-on.
# Synced from the source repo greenautarky/influxDBv1 by CI — DO NOT EDIT BY HAND.
# The only delta vs. the source config is the `image:` key: this entry is
# install-by-pull (the multi-arch image is built by the source repo's CI and
# published to GHCR), so the source repo can stay private.
# `version` stays in lock-step with the GHCR image tag and with the OS bake list
# (ha-operating-system buildroot-external/package/hassio/addon-images.json).
name: ga_InfluxDBv1
version: 0.0.17
slug: ga_influxdbv1
description: Scalable datastore for metrics, events, and real-time analytics
url: https://github.com/hassio-addons/addon-influxdb
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:chart-areaspline
startup: services
homeassistant: 0.92.0b2
hassio_api: true
arch:
  - aarch64
  - amd64
  - armv7
init: false
map:
  - share:rw
  - ssl
ports:
  80/tcp: null
  8086/tcp: 8086
  8088/tcp: 8088
ports_description:
  80/tcp: Web interface (Not required for Ingress)
  8086/tcp: InfluxDB server
  8088/tcp: RPC service for backup and restore
auth_api: true
options:
  auth: true
  # Credential model for the on-device InfluxDB users. Default true: each
  # consuming add-on receives its own least-privilege credential, minted here and
  # handed to ga_manager via /data/influx-users.json (ADR-0002/0003 device-local
  # plane, Odoo # 548, #553). false selects a single shared credential instead.
  #
  # The default applies to freshly-installed devices only: the Supervisor keeps a
  # device's stored option across add-on updates, so existing devices are
  # unchanged and handled out of band. Delivery is ga_manager's converge step.
  per_user_secrets: true
  reporting: true
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  # Optimised for resource-constrained devices.
  envvars:
    - name: INFLUXDB_REPORTING_DISABLED
      value: "true"
    - name: INFLUXDB_DATA_CACHE_MAX_MEMORY_SIZE
      value: "64m"
    - name: INFLUXDB_DATA_MAX_WAL_SIZE
      value: "16m"
    - name: INFLUXDB_DATA_WAL_FSYNC_DELAY
      value: "100ms"
    - name: INFLUXDB_DATA_TSM_USE_MADV_WILLNEED
      value: "false"
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  auth: bool
  per_user_secrets: bool?
  reporting: bool
  ssl: bool
  certfile: str
  keyfile: str
  envvars:
    - name: match(^INFLUXDB_([A-Z0-9_])+$)
      value: str
  leave_front_door_open: bool?
image: ghcr.io/greenautarky/ga_influxdbv1-{arch}
